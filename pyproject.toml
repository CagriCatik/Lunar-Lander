[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-lander-mpc"
version = "0.1.0"
description = "Sampling-based model predictive control for Gymnasium LunarLander-v3"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["gymnasium[box2d]==1.2.3", "numpy>=1.26,<3", "matplotlib>=3.9,<4"]

[project.urls]
Repository = "https://github.com/CagriCatik/Lunar-Lander"
Documentation = "https://github.com/CagriCatik/Lunar-Lander/blob/main/docs/controller.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
lunar-mpc = "lunar_mpc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
